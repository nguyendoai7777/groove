<!doctype html>
<html lang="en" theme="dark">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vite.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Groove X</title>

		<!--
			Platform tag, for the handful of rules that cannot be written once.

			The translucency of the side nav is the main one: Windows and macOS each
			blur the desktop behind the window natively, but with different strength,
			so the CSS tint sitting on top of that blur has to differ too.

			Inline and in the head so it lands before first paint.
		-->
		<script>
			document.documentElement.dataset.os = /Mac/.test(navigator.userAgent) ? 'macos' : /Win/.test(navigator.userAgent) ? 'windows' : 'linux';
		</script>

		<!--
			Base reset, inline so it applies on first parse rather than waiting on the
			module graph. `background: transparent` is load-bearing, not cosmetic: the
			window is transparent and undecorated so the platform can blur the desktop
			behind it, and any opaque background here would seal that off.
		-->
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				height: 100%;
				background: transparent;
				overflow: hidden;
				font-family:
					ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
			}
			#app {
				height: 100%;
			}
		</style>
	</head>

	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
