[package]
name = "groove-app"
description = "App Groovex: GPUI + materiant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "groove"
path = "src/main.rs"

[dependencies]
groove-core.workspace = true
groove-library.workspace = true
groove-audio.workspace = true
# GPUI đi qua materiant (`materiant::gpui_kit`), không ghim gpui-kit lần hai (D-6).
materiant.workspace = true
# Ctrl+Shift+I / Ctrl+Shift+C ở bản debug (D-19, D-25); bản release crate rỗng.
devtool.workspace = true
# Tự cập nhật: soát manifest ký, tải, cài, release note (groove-gd2_05).
updater.workspace = true
anyhow.workspace = true
crossbeam-channel.workspace = true
futures.workspace = true
# `Frame` của bìa nhúng đã giải mã (`player::embedded_cover`); cùng bản với GPUI, groove-library.
image = { version = "0.25", default-features = false }
# Một phiên (đặc tả 5.5).
interprocess = "2.4"
log.workspace = true
# HWND, NSView cho media session, taskbar.
raw-window-handle = "0.6"
serde.workspace = true
serde_json.workspace = true
# Media session. Linux đi `zbus` thuần Rust, không `libdbus` (đặc tả 5.4).
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
unicode-normalization.workspace = true
# `Connection` trong transaction của `library_ctl`.
rusqlite = { version = "0.41", features = ["bundled", "functions"] }

[target.'cfg(windows)'.dependencies]
# Taskbar, DACL của pipe, focus phiên chính (đặc tả 5.3, 5.5); registry, liên kết tệp, AppUserModelID (gd2_01).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Nghe extension GNOME Shell của Groovex (nền mờ, `platform::backdrop::gnome`); cùng bản zbus với souvlaki.
zbus = { version = "5", default-features = false, features = ["async-io"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# Phím tắt toàn cục (groove-gd2_04), như daemon của fastcast. Linux: crate chỉ có X11, chưa dùng (portal, backlog).
global-hotkey = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[build-dependencies]
# Task 27 thêm `build.rs` nhúng icon exe.
embed-resource = "3"

[dev-dependencies]
# Test: `set_language` chỉ có hiệu lực trên luồng gọi, các test chạy song song không giẫm ngôn ngữ của nhau.
groove-core = { workspace = true, features = ["test-support"] }
# Test hộp sửa thẻ soi khung ID3 trong tệp sau khi lưu.
id3 = "1"
# Test view trong App ảo: `test-support` bật thẳng trên gpui-pre, cùng crate với GPUI của materiant.
gpui = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"] }

[lints]
workspace = true
