[package]
name = "groove-audio"
description = "Phát nhạc: symphonia + cpal, DSP; luồng decoder + callback thực thời, không UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
groove-core.workspace = true
crossbeam-channel.workspace = true
# "Save as new" giữ FLAC (groove-gd2_02): Apache-2.0, thuần Rust; tắt `par` (luồng phụ), `serde`, `log`.
flacenc = { version = "0.5", default-features = false }
futures.workspace = true
log.workspace = true
ringbuf = "0.6"
rubato = "5"
symphonia = { version = "0.6", default-features = false, features = ["mp3", "aac", "alac", "isomp4", "flac", "wav", "pcm", "ogg", "vorbis"] }
thiserror.workspace = true

# Xuất âm. Linux: cpal đi qua ALSA nên link động `libasound.so` (LGPL-2.1), chủ dự án đã chấp nhận (G-2): chỉ link động,
# không kèm vào bản cài, không dùng link tĩnh hay feature kèm mã thư viện.
[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18"

# Bộ mã hoá MP3 / AAC của Windows (Media Foundation) cho "Save as new" (groove-gd2_02). MIT / Apache-2.0; cùng bản với GPUI,
# fastcast nên không thêm bản mới vào `Cargo.lock`.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

# M4R ở Linux / macOS (bộ mã hoá AAC-LC + đóng gói MPEG-4): thuần Rust, MIT OR Apache-2.0, không `unsafe`, chỉ kéo thêm
# `filmcraft-bitstream` (cùng giấy phép) và `thiserror` — không cần thư viện hệ thống, `.deb` không thêm phụ thuộc.
[target.'cfg(not(windows))'.dependencies]
filmcraft-aac = "0.9"
filmcraft-isobmff = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", optional = true }

[features]
default = ["linux-alsa"]
linux-alsa = ["dep:cpal"]

[lints]
workspace = true

[dev-dependencies]
groove-core = { workspace = true, features = ["test-support"] }
# Tệp nhạc mẫu tự dựng cho test xuất (groove-gd2_02).
groove-library.workspace = true
