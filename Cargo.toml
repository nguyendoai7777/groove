# Workspace mới của groove (G-1). Bản Tauri ở `src-tauri/` nằm ngoài workspace này, gỡ ở groove-gd1_29.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["src-tauri", "vendor/souvlaki"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
# Mã đóng (D-2): không publish, cargo-deny bỏ qua crate nội bộ.
license = "LicenseRef-groove-proprietary"
publish = false

[workspace.dependencies]
groove-core = { path = "crates/groove-core" }
groove-library = { path = "crates/groove-library" }
groove-audio = { path = "crates/groove-audio" }
# Repo anh em trong workspace xdesktop (clone cạnh groove). Worktree ở `.claude/worktrees/` cần lối nối
# `.claude/worktrees/materiant` → `materiant` (junction / symlink) để đường dẫn này trỏ đúng.
# Font nhúng (D-20): Mona Sans (mặc định) và Be Vietnam Pro, chọn ở Settings → Chung; không theo font của máy.
materiant = { path = "../materiant", features = ["font-mona-sans", "font-be-vietnam-pro"] }

anyhow = "1"
crossbeam-channel = "0.5"
futures = "0.3"
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"

# KHÔNG `panic = "abort"` (đặc tả S25): decoder và đọc thẻ phải `catch_unwind` được panic do tệp độc.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# target/ nhẹ đi: mã của ta giữ số dòng cho backtrace, thư viện ngoài bỏ debuginfo.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Bản vá GPUI của materiant (inspector Ctrl+Shift+I chỉ ở bản debug cần `Window::inspector_ancestor_sources`):
# `materiant/CLAUDE.md`, mục "GPUI vá ở vendor/gpui-pre". Thiếu khối này thì materiant không biên dịch.
[patch.crates-io]
gpui-pre = { path = "../materiant/vendor/gpui-pre" }
# MPRIS của souvlaki 0.9.3 thức 100 lần / s lúc nghỉ (vòng recv_timeout 10 ms): CLAUDE.md, mục Bẫy.
souvlaki = { path = "vendor/souvlaki" }
