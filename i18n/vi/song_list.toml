# Vùng song_list: khoá viết không tiền tố, tra bằng t!("song_list.<khoá>").

[kind]
album = "Album"
folder = "Thư mục"
playlist = "Danh sách phát"

[header]
items = "{count} bài"
play_all = "Phát tất cả"

[column]
index = "#"
title = "Tiêu đề"
duration = "Thời lượng"
artist = "Nghệ sĩ"

[loading]
title = "Đang tải bài hát..."

[empty]
title = "Mục này chưa có bài nào"
hint = "Quét thư mục để thêm bài hát"

[empty_play]
message = "Chưa có bài nào để phát"

[error]
title = "Không đọc được danh sách bài"
hint = "Thử mở lại mục này sau ít phút"

[gone]
title = "Không còn mục này"
hint = "Album, thư mục hoặc danh sách phát này đã bị xoá"
