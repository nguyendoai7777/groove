# Vùng settings: khoá viết không tiền tố, tra bằng t!("settings.<khoá>").

title = "Settings"

[tab]
general = "General"
eq = "EQ"
keybindings = "Keyboard shortcuts"
library = "Library"

[general]
font = "Font"
steps = "Seek and volume steps"
seek_step = "Seek step (seconds)"
seek_step_hint = "1 or more. Used by the seek keys and buttons."
volume_step = "Volume step"
volume_step_hint = "1 to 100. Used by the up and down keys and the mouse wheel."

[eq]
title = "Equalizer"
preset = "Preset:"
bass_boost = "Bass boost"
gain_unit = "dB"
bass_boost_hint = "Boosts the deep low end for the best bass experience."

[preset]
custom = "Custom"
flat = "Flat"
bass_strong = "Bass strong"
bass_moderate = "Bass moderate"
pop = "Pop"
rock = "Rock"
electronic = "Electronic"
vocal = "Vocal"
treble = "Treble"

[keys]
hint = "A JSON array where every item has key and command. Combos read like ctrl+k, two-key sequences like g m."
reset = "Reset to defaults"
commands = "Available commands"
area_label = "Keyboard shortcut list (JSON)"

[keys.error]
empty = "The box is empty. Enter a JSON array, or press Reset to defaults."
syntax = "Invalid JSON at line {line}, column {column}. Check the commas and brackets."
not_array = "It must be an array, starting with [ and ending with ]."
missing_field = "Item {number} has no key or command, or one of them is empty."
unknown_command = "Item {number}: there is no command \"{command}\". See the list of commands below."
invalid_key = "Item {number}: cannot read the key \"{key}\". Use ctrl, alt, shift, at most two keys."
duplicate = "Item {number}: the key \"{key}\" is already used by item {first}."
unreachable = "Item {number}: the sequence \"{key}\" can never be reached because its first key is already a single key in item {prefix}."

[roots]
title = "Music folders"
hint = "Groove watches these folders and updates itself when files change."
empty = "No folders yet. Press Add folder to start."
unavailable = "The library could not be opened, so folders cannot be listed."
add = "Add folder"
rescan = "Rescan"
remove = "Remove"
confirm_remove = "Remove for real"
remove_note = "Removing a folder only takes its songs out of the library. The files stay on disk."
busy = "Importing or scanning..."

[default_player]
title = "Default player"
checking = "Asking the system..."
is_default = "Groove X is the default player for MP3 files."
not_default = "Groove X is not the default player for MP3 files."
not_installed = "This copy was not installed with the installer, so the system does not know Groove X yet. Install it, then set it here."
unknown = "Could not ask the system which player is the default."
open_settings = "Open default apps settings"
set = "Make default player"
hint_settings = "Windows does not let apps make themselves the default. On the page that opens, choose Groove X as the music player, or pick it for each file type."
hint_set = "Applies to this account, for every format Groove X plays. Nothing changes until you click."
opened = "System settings are open. Choose Groove X, then come back here."
applied = "Groove X is now the default player."
failed = "Could not set it. See the log for the reason."
